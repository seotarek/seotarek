<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 280" role="img" aria-labelledby="title desc">
  <title id="title">Tarek Mohamed: Principal Systems &amp; AI Security Architect</title>
  <desc id="desc">Architectural profile header for Tarek Mohamed: Deterministic Agent Runtimes, Sub-Millisecond Security Gates, and Systems Engineering in Rust.</desc>
  <style>
    :root {
      --bg-start: #f8fafc;
      --bg-end: #f1f5f9;
      --surface: #ffffff;
      --surface-subtle: #f1f5f9;
      --border: #e2e8f0;
      --border-strong: #cbd5e1;
      --text-main: #0f172a;
      --text-sub: #334155;
      --text-muted: #64748b;
      --primary: #2563eb;
      --secondary: #0d9488;
      --tertiary: #4f46e5;
      --grid-line: rgba(15, 23, 42, 0.035);
      --status-green: #10b981;
      --badge-bg: rgba(37, 99, 235, 0.08);
      --badge-teal: rgba(13, 148, 136, 0.08);
      --badge-indigo: rgba(79, 70, 229, 0.08);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-start: #070b14;
        --bg-end: #0f172a;
        --surface: #111a2c;
        --surface-subtle: #162238;
        --border: #1e293b;
        --border-strong: #334155;
        --text-main: #f8fafc;
        --text-sub: #cbd5e1;
        --text-muted: #94a3b8;
        --primary: #3b82f6;
        --secondary: #14b8a6;
        --tertiary: #818cf8;
        --grid-line: rgba(148, 163, 184, 0.05);
        --status-green: #34d399;
        --badge-bg: rgba(59, 130, 246, 0.14);
        --badge-teal: rgba(20, 184, 166, 0.14);
        --badge-indigo: rgba(129, 140, 248, 0.14);
      }
    }

    .eyebrow {
      fill: var(--text-sub);
      font: 700 11.5px/1 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      letter-spacing: 0.07em;
    }
    .name {
      fill: var(--text-main);
      font: 800 46px/1.1 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      letter-spacing: -0.03em;
    }
    .role {
      fill: var(--primary);
      font: 600 18.5px/1.3 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      letter-spacing: -0.01em;
    }
    .thesis {
      fill: var(--text-sub);
      font: 400 15px/1.45 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .stack-pill {
      fill: var(--text-main);
      font: 600 12.5px/1 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    .meta-coord {
      fill: var(--text-muted);
      font: 500 12.5px/1 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    .layer-id {
      fill: var(--text-muted);
      font: 700 10.5px/1 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      letter-spacing: 0.06em;
    }
    .layer-title {
      fill: var(--text-main);
      font: 600 12px/1.2 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    .layer-metric {
      font: 700 11px/1 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
  </style>

  <defs>
    <linearGradient id="canvasBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--bg-start)" />
      <stop offset="100%" stop-color="var(--bg-end)" />
    </linearGradient>
    <linearGradient id="accentRule" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="var(--primary)" />
      <stop offset="55%" stop-color="var(--secondary)" />
      <stop offset="100%" stop-color="var(--tertiary)" />
    </linearGradient>
    <pattern id="archGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="var(--grid-line)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Outer Frame -->
  <rect width="1280" height="280" rx="20" fill="url(#canvasBg)" />
  <rect width="1280" height="280" rx="20" fill="url(#archGrid)" />
  <rect x="1" y="1" width="1278" height="278" rx="19" fill="none" stroke="var(--border)" stroke-width="1.5" />

  <!-- Top Precision Rule -->
  <rect x="56" y="1" width="260" height="3" rx="1.5" fill="url(#accentRule)" />

  <!-- Left Column: Identity & Architectural Thesis -->
  <g transform="translate(56, 34)">
    <!-- Status Telemetry Pill -->
    <rect x="0" y="0" width="348" height="26" rx="13" fill="var(--surface-subtle)" stroke="var(--border-strong)" stroke-width="1" />
    <circle cx="15" cy="13" r="4.5" fill="var(--status-green)" />
    <text x="28" y="17" class="eyebrow">PRINCIPAL ARCHITECT · CAIRO, EG · 17+ YRS</text>

    <!-- Name & Headline -->
    <text x="0" y="76" class="name">Tarek Mohamed</text>
    <text x="0" y="108" class="role">AI Systems &amp; Security Researcher · Principal Systems Engineer</text>
    <text x="0" y="138" class="thesis">Architecting deterministic AI agent runtimes, sub-millisecond security firewalls,</text>
    <text x="0" y="160" class="thesis">memory-safe Rust engines, and regulatory-aligned clinical ecosystems.</text>

    <!-- Core Runtime Stack Strip -->
    <g transform="translate(0, 182)">
      <rect x="0" y="0" width="60" height="28" rx="6" fill="var(--surface)" stroke="var(--border-strong)" stroke-width="1" />
      <text x="15" y="18" class="stack-pill">Rust</text>

      <rect x="68" y="0" width="74" height="28" rx="6" fill="var(--surface)" stroke="var(--border-strong)" stroke-width="1" />
      <text x="82" y="18" class="stack-pill">Python</text>

      <rect x="150" y="0" width="46" height="28" rx="6" fill="var(--surface)" stroke="var(--border-strong)" stroke-width="1" />
      <text x="164" y="18" class="stack-pill">Go</text>

      <rect x="204" y="0" width="102" height="28" rx="6" fill="var(--surface)" stroke="var(--border-strong)" stroke-width="1" />
      <text x="218" y="18" class="stack-pill">TypeScript</text>

      <rect x="314" y="0" width="72" height="28" rx="6" fill="var(--surface)" stroke="var(--border-strong)" stroke-width="1" />
      <text x="328" y="18" class="stack-pill">Kotlin</text>

      <rect x="394" y="0" width="102" height="28" rx="6" fill="var(--surface)" stroke="var(--border-strong)" stroke-width="1" />
      <text x="408" y="18" class="stack-pill">PostgreSQL</text>

      <text x="514" y="18" class="meta-coord">DOI: 10.5281/zenodo.22731104</text>
    </g>
  </g>

  <!-- Right Column: Abstract 3-Layer Deterministic Architecture Schematic -->
  <g transform="translate(816, 32)">
    <!-- Vertical Bus Line -->
    <line x1="24" y1="36" x2="24" y2="180" stroke="var(--border-strong)" stroke-width="2" stroke-dasharray="3 3" />

    <!-- Layer 01: Deterministic Security Gate -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="408" height="62" rx="10" fill="var(--surface)" stroke="var(--border)" stroke-width="1.4" />
      <circle cx="24" cy="31" r="5" fill="var(--primary)" />
      <text x="44" y="25" class="layer-id">LAYER 01 // RUNTIME FIREWALL</text>
      <text x="44" y="45" class="layer-title">Syntactic &amp; AST Policy Isolation</text>
      <rect x="312" y="19" width="80" height="24" rx="6" fill="var(--badge-bg)" />
      <text x="324" y="35" fill="var(--primary)" class="layer-metric">&lt; 0.1 ms</text>
    </g>

    <!-- Layer 02: Epistemic & Clinical Governance -->
    <g transform="translate(0, 77)">
      <rect x="0" y="0" width="408" height="62" rx="10" fill="var(--surface)" stroke="var(--border)" stroke-width="1.4" />
      <circle cx="24" cy="31" r="5" fill="var(--secondary)" />
      <text x="44" y="25" class="layer-id">LAYER 02 // VERIFIED EXECUTION</text>
      <text x="44" y="45" class="layer-title">Zero-Token Deterministic Engines</text>
      <rect x="304" y="19" width="88" height="24" rx="6" fill="var(--badge-teal)" />
      <text x="315" y="35" fill="var(--secondary)" class="layer-metric">IEC 62304</text>
    </g>

    <!-- Layer 03: Systems & Memory Safety -->
    <g transform="translate(0, 154)">
      <rect x="0" y="0" width="408" height="62" rx="10" fill="var(--surface)" stroke="var(--border)" stroke-width="1.4" />
      <circle cx="24" cy="31" r="5" fill="var(--tertiary)" />
      <text x="44" y="25" class="layer-id">LAYER 03 // NATIVE SYSTEMS CORE</text>
      <text x="44" y="45" class="layer-title">Memory-Safe Rust &amp; Edge Compute</text>
      <rect x="304" y="19" width="88" height="24" rx="6" fill="var(--badge-indigo)" />
      <text x="316" y="35" fill="var(--tertiary)" class="layer-metric">Zero-Copy</text>
    </g>
  </g>
</svg>
