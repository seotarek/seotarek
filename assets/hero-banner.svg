<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 180" role="img" aria-labelledby="title desc">
  <title id="title">Tarek Mohamed — Principal Software Architect, AI Systems &amp; Security Researcher</title>
  <desc id="desc">High-contrast, mobile-first banner for Tarek Mohamed.</desc>
  <style>
    :root {
      --bg-start: #f8fafc;
      --bg-end: #f1f5f9;
      --card-border: #cbd5e1;
      --text-main: #0f172a;
      --text-sub: #334155;
      --primary: #2563eb;
      --secondary: #0d9488;
      --accent-glow: rgba(37, 99, 235, 0.08);
      --pill-bg: #ffffff;
      --pill-border: #cbd5e1;
      --pill-text: #1e293b;
      --status-green: #10b981;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-start: #060b14;
        --bg-end: #0f172a;
        --card-border: #1e293b;
        --text-main: #f8fafc;
        --text-sub: #94a3b8;
        --primary: #3b82f6;
        --secondary: #14b8a6;
        --accent-glow: rgba(59, 130, 246, 0.12);
        --pill-bg: #111c2d;
        --pill-border: #1e293b;
        --pill-text: #e2e8f0;
        --status-green: #34d399;
      }
    }

    .status-lbl {
      font: 700 12px/1 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      letter-spacing: 0.06em;
      fill: var(--pill-text);
      text-transform: uppercase;
    }
    .title-name {
      font: 800 36px/1.1 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      letter-spacing: -0.03em;
      fill: var(--text-main);
    }
    .title-role {
      font: 700 16px/1.3 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      letter-spacing: -0.01em;
      fill: var(--primary);
    }
    .title-desc {
      font: 500 13px/1.4 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      fill: var(--text-sub);
    }
  </style>

  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--bg-start)" />
      <stop offset="100%" stop-color="var(--bg-end)" />
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="var(--primary)" />
      <stop offset="50%" stop-color="var(--secondary)" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
  </defs>

  <!-- Card Background -->
  <rect width="800" height="180" rx="16" fill="url(#bgGrad)" />
  <rect x="1" y="1" width="798" height="178" rx="15" fill="none" stroke="var(--card-border)" stroke-width="1.2" />

  <!-- Accent Top Border -->
  <rect x="36" y="1" width="180" height="3" rx="1.5" fill="url(#accentLine)" />

  <!-- Status Pill -->
  <g transform="translate(36, 24)">
    <rect width="320" height="24" rx="12" fill="var(--pill-bg)" stroke="var(--pill-border)" stroke-width="1" />
    <circle cx="14" cy="12" r="4.5" fill="var(--status-green)" />
    <text x="26" y="16" class="status-lbl">SYSTEMS ARCHITECT · 17+ YEARS</text>
  </g>

  <!-- Identity & Role -->
  <text x="36" y="84" class="title-name">Tarek Mohamed</text>
  <text x="36" y="114" class="title-role">Principal Software Architect · AI Systems &amp; Security Researcher</text>
  <text x="36" y="144" class="title-desc">Deterministic AI Agent Safety · Rust Graphics &amp; Systems · Medical CDS · Distributed Platforms</text>
</svg>
