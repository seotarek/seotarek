<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 210" role="img" aria-labelledby="metricsTitle metricsDesc">
  <title id="metricsTitle">Tarek Mohamed — Key Architecture &amp; Research Metrics</title>
  <desc id="metricsDesc">Four core metrics: 17+ Years Systems Architecture, &lt;0.1ms AI Security Latency, 24 Clinical AI Skills, and 60+ Open Source Repositories.</desc>
  <style>
    :root {
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --metric-num: #0f172a;
      --metric-sub: #475569;
      --metric-label: #2563eb;
      --glow-line: #3b82f6;
      --accent-teal: #0d9488;
      --accent-purple: #7c3aed;
      --accent-emerald: #10b981;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --card-bg: #0b1320;
        --card-border: #1e293b;
        --metric-num: #f8fafc;
        --metric-sub: #94a3b8;
        --metric-label: #60a5fa;
        --glow-line: #38bdf8;
        --accent-teal: #14b8a6;
        --accent-purple: #c084fc;
        --accent-emerald: #34d399;
      }
    }

    .num {
      font: 800 38px/1 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      letter-spacing: -0.03em;
    }
    .lbl {
      font: 700 12.5px/1.2 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .sub {
      font: 500 12px/1.4 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
  </style>

  <g fill="none">
    <!-- Card 1: Experience -->
    <g transform="translate(15, 15)">
      <rect width="275" height="180" rx="14" fill="var(--card-bg)" stroke="var(--card-border)" stroke-width="1.5" />
      <path d="M 24 20 L 76 20" stroke="var(--metric-label)" stroke-width="3" stroke-linecap="round" />
      <text x="24" y="74" fill="var(--metric-num)" class="num">17+ Yrs</text>
      <text x="24" y="104" fill="var(--metric-label)" class="lbl">Principal Architect</text>
      <text x="24" y="132" fill="var(--metric-sub)" class="sub">Systems engineering, cloud scale,</text>
      <text x="24" y="152" fill="var(--metric-sub)" class="sub">and mission-critical platforms.</text>
    </g>

    <!-- Card 2: AI Security Latency -->
    <g transform="translate(310, 15)">
      <rect width="275" height="180" rx="14" fill="var(--card-bg)" stroke="var(--card-border)" stroke-width="1.5" />
      <path d="M 24 20 L 76 20" stroke="var(--accent-teal)" stroke-width="3" stroke-linecap="round" />
      <text x="24" y="74" fill="var(--metric-num)" class="num">&lt; 0.1 ms</text>
      <text x="24" y="104" fill="var(--accent-teal)" class="lbl">IPI Defense Latency</text>
      <text x="24" y="132" fill="var(--metric-sub)" class="sub">LightGuard-Agent firewall with</text>
      <text x="24" y="152" fill="var(--metric-sub)" class="sub">100% mitigation rate (Zenodo DOI).</text>
    </g>

    <!-- Card 3: Clinical AI Skills -->
    <g transform="translate(605, 15)">
      <rect width="275" height="180" rx="14" fill="var(--card-bg)" stroke="var(--card-border)" stroke-width="1.5" />
      <path d="M 24 20 L 76 20" stroke="var(--accent-purple)" stroke-width="3" stroke-linecap="round" />
      <text x="24" y="74" fill="var(--metric-num)" class="num">24 Skills</text>
      <text x="24" y="104" fill="var(--accent-purple)" class="lbl">MedOrqis Ecosystem</text>
      <text x="24" y="132" fill="var(--metric-sub)" class="sub">Evidence-grounded medical AI,</text>
      <text x="24" y="152" fill="var(--metric-sub)" class="sub">IEC 62304 Class A/B/C &amp; ISO 14971.</text>
    </g>

    <!-- Card 4: Open Source Ecosystem -->
    <g transform="translate(900, 15)">
      <rect width="275" height="180" rx="14" fill="var(--card-bg)" stroke="var(--card-border)" stroke-width="1.5" />
      <path d="M 24 20 L 76 20" stroke="var(--accent-emerald)" stroke-width="3" stroke-linecap="round" />
      <text x="24" y="74" fill="var(--metric-num)" class="num">60+ Repos</text>
      <text x="24" y="104" fill="var(--accent-emerald)" class="lbl">Open Source Artifacts</text>
      <text x="24" y="132" fill="var(--metric-sub)" class="sub">Rust engines, MCP servers, PyPI/npm</text>
      <text x="24" y="152" fill="var(--metric-sub)" class="sub">packages, and developer tooling.</text>
    </g>
  </g>
</svg>
